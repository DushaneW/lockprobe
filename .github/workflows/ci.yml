name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: install fuse
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: test
        env:
          # FUSE-backed tests must run on Linux CI, not skip.
          LOCKPROBE_REQUIRE_FUSE: ${{ runner.os == 'Linux' && '1' || '' }}
        run: go test -count=1 -v ./...

  # Real kernel NFS. Two mounts of one export with `nosharecache` get
  # separate superblocks on one client. Each case asserts lockprobe's exit
  # code and also prints what real SQLite does on the same mount pair.
  #
  # NFSv4.2 is expected to FAIL here: both mounts belong to the same NFSv4
  # client, so the server does not make their locks exclude each other.
  # This was found by this job and confirmed by SQLite losing commits on
  # the same pair. It says nothing about two separate NFSv4 hosts.
  nfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o lockprobe ./cmd/lockprobe
      - name: start nfs server
        run: |
          sudo apt-get update && sudo apt-get install -y nfs-kernel-server
          sudo mkdir -p /srv/share && sudo chmod 777 /srv/share
          echo '/srv/share 127.0.0.1(rw,sync,no_subtree_check,no_root_squash,insecure)' | sudo tee /etc/exports
          sudo exportfs -ra
          sudo systemctl restart nfs-kernel-server
      - name: nfsv3 with lockd, expect pass
        run: ./scripts/nfs-case.sh "vers=3,nosharecache" 0
      - name: nfsv3 with client-local locks, expect fail
        if: always()
        run: ./scripts/nfs-case.sh "vers=3,nosharecache,local_lock=posix" 1
      - name: nfsv4.2, two mounts on one client, expect fail
        if: always()
        run: ./scripts/nfs-case.sh "vers=4.2,nosharecache" 1
